<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理登录 - Leo-Go</title>
  <link rel="stylesheet" href="/static/vendor/tabler/tabler.min.css" />
  <link rel="stylesheet" href="/static/admin.css?v=20260807-1" />
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center">
  <div class="container-xl" style="max-width: 440px;">
    <div class="text-center mb-4">
      <div class="display-5 fw-bold leo-login-brand">🚀 Leo-Go</div>
      <p class="text-secondary mt-1 mb-0">Leonardo 视频生成 API 网关 · 管理后台</p>
    </div>

    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">管理后台登录</h1>
        <p class="text-secondary small mb-4">请输入管理员账号密码</p>

        <div class="form-group mb-3">
          <label class="form-label" for="username">账号</label>
          <input id="username" class="form-control input-text" type="text" autocomplete="username" />
        </div>

        <div class="form-group mb-4">
          <label class="form-label" for="password">密码</label>
          <input id="password" class="form-control input-text" type="password" autocomplete="current-password" />
        </div>

        <div class="d-flex align-items-center gap-3">
          <button id="loginBtn" class="btn btn-primary px-4" type="button">登录</button>
          <span id="loginMsg" class="msg"></span>
        </div>
      </div>
    </div>

    <p class="text-center text-secondary small mt-4">
      交流群 <a class="leo-footer-link" href="https://qun.qq.com/qqun/1101086346" target="_blank" rel="noopener">1101086346</a>
      · <a class="leo-footer-link" href="https://github.com/LImingcheng07/leo-go" target="_blank" rel="noopener">GitHub</a>
    </p>
  </div>

  <script>
    (function () {
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");
      const loginMsg = document.getElementById("loginMsg");

      function showMsg(text, isError) {
        loginMsg.textContent = text;
        loginMsg.style.color = isError ? "#ffb4bc" : "#4de2c4";
      }

      async function checkAlreadyLogin() {
        try {
          const res = await fetch("/api/v1/auth/me");
          if (res.ok) {
            window.location.href = "/";
          }
        } catch (_) {
          // ignore
        }
      }

      async function doLogin() {
        loginBtn.disabled = true;
        showMsg("", false);
        try {
          const res = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: username.value.trim(),
              password: password.value,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            showMsg(data.detail || data.message || "登录失败", true);
            return;
          }
          window.location.href = "/";
        } catch (err) {
          showMsg(err.message || "登录失败", true);
        } finally {
          loginBtn.disabled = false;
        }
      }

      loginBtn.addEventListener("click", doLogin);
      password.addEventListener("keydown", (e) => {
        if (e.key === "Enter") doLogin();
      });

      checkAlreadyLogin();
    })();
  </script>
</body>
</html>
